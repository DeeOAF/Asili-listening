<!doctype html>
<html lang="en-GB" data-theme="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Work Planning Cascade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Georama:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: a working console. Sticky controls, tabs, then one view at a time on a 1180px column. */
:root {
  --bg: #F3F5F4;
  --surface: #FFFFFF;
  --surface-2: #EBF0EE;
  --ink: #15262B;
  --ink-2: #455A60;
  --ink-3: #6E8085;
  --line: #D6DFDC;
  --line-2: #E6ECEA;
  --focus: #2F6EA8;
  --btn: #15262B;
  --btn-ink: #FFFFFF;
  --s-done: #0E6F55;   --s-done-bg: #D6EFE5;
  --s-ahead: #1B8A67;  --s-ahead-bg: #DDF1E8;
  --s-on: #2F6EA8;     --s-on-bg: #E0EBF6;
  --s-slip: #9A6A0C;   --s-slip-bg: #F7EACB;
  --s-behind: #B8491C; --s-behind-bg: #F9E0D2;
  --s-crit: #972A22;   --s-crit-bg: #F5D7D3;
  --pt-enrolment: #1F5E99; --pt-enrolment-bg: #E0EBF6;
  --pt-repayment: #0E6F55; --pt-repayment-bg: #D6EFE5;
  --pt-hvc: #7A4FA3; --pt-hvc-bg: #EDE3F6;
  --pt-extension: #0F6F78; --pt-extension-bg: #D8EFF1;
  --pt-duka: #A5521C; --pt-duka-bg: #F8E3D3;
  --shadow: 0 1px 2px rgba(21,38,43,.05), 0 4px 14px rgba(21,38,43,.04);
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-head: 'Space Grotesk', 'Inter', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1819; --surface: #172224; --surface-2: #1E2C2E; --ink: #E5EEEC; --ink-2: #A9BDBB; --ink-3: #7F9593;
    --line: #2B3C3E; --line-2: #223133; --focus: #6FA8DC; --btn: #E5EEEC; --btn-ink: #0F1819;
    --s-done: #4FD1A5;  --s-done-bg: #123A2E;
    --s-ahead: #5BCB9F; --s-ahead-bg: #143A2E;
    --s-on: #7DB4E8;    --s-on-bg: #16304A;
    --s-slip: #E2B04A;  --s-slip-bg: #3D2F10;
    --s-behind: #F08A5C; --s-behind-bg: #432416;
    --s-crit: #F27A70;  --s-crit-bg: #461C19;
    --pt-enrolment: #8CBDEB; --pt-enrolment-bg: #16304A;
    --pt-repayment: #5BCB9F; --pt-repayment-bg: #143A2E;
    --pt-hvc: #C4A2E8; --pt-hvc-bg: #34224A;
    --pt-extension: #62CBD6; --pt-extension-bg: #123A3F;
    --pt-duka: #F0A06A; --pt-duka-bg: #432416;
    --shadow: 0 1px 2px rgba(0,0,0,.25), 0 4px 14px rgba(0,0,0,.2);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1819; --surface: #172224; --surface-2: #1E2C2E; --ink: #E5EEEC; --ink-2: #A9BDBB; --ink-3: #7F9593;
  --line: #2B3C3E; --line-2: #223133; --focus: #6FA8DC; --btn: #E5EEEC; --btn-ink: #0F1819;
  --s-done: #4FD1A5;  --s-done-bg: #123A2E;
  --s-ahead: #5BCB9F; --s-ahead-bg: #143A2E;
  --s-on: #7DB4E8;    --s-on-bg: #16304A;
  --s-slip: #E2B04A;  --s-slip-bg: #3D2F10;
  --s-behind: #F08A5C; --s-behind-bg: #432416;
  --s-crit: #F27A70;  --s-crit-bg: #461C19;
  --pt-enrolment: #8CBDEB; --pt-enrolment-bg: #16304A;
  --pt-repayment: #5BCB9F; --pt-repayment-bg: #143A2E;
  --pt-hvc: #C4A2E8; --pt-hvc-bg: #34224A;
  --pt-extension: #62CBD6; --pt-extension-bg: #123A3F;
  --pt-duka: #F0A06A; --pt-duka-bg: #432416;
  --shadow: 0 1px 2px rgba(0,0,0,.25), 0 4px 14px rgba(0,0,0,.2);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5;
  padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 1180px; margin: 0 auto; }
h1, h2, h3, h4 { font-family: var(--font-head); font-weight: 600; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
p { margin: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num, td.n, .tab-num { font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; padding-top: 22px; padding-bottom: 14px; }
.top h1 { font-size: 26px; }
.top p { color: var(--ink-2); max-width: 62ch; margin-top: 2px; }
.flag { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); border: 1px solid var(--line); background: var(--surface); padding: 4px 10px; border-radius: 999px; }

/* controls */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; padding-block: 10px; }
.ctl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ctl label, .lab { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); }
select, input[type=number], input[type=text], textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0;
}
select { padding-right: 24px; max-width: 100%; }
textarea { width: 100%; resize: vertical; line-height: 1.45; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--line-2); min-width: 44px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); font-weight: 600; }
.asof { color: var(--ink-2); font-size: 13px; }

/* tabs */
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 20px; scrollbar-width: thin; }
.tabs button { border: 0; background: transparent; padding: 12px 14px; cursor: pointer; color: var(--ink-2); white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.tabs button:hover { color: var(--ink); }

/* generic pieces */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--ink-3); }
.btn.solid { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.btn.small { padding: 3px 9px; font-size: 12.5px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.panel h3 { font-size: 16px; margin-bottom: 4px; }
.sub { color: var(--ink-2); font-size: 13px; }
.muted { color: var(--ink-3); }
.sec { margin-top: 24px; }
.sec > h2 { font-size: 18px; margin-bottom: 4px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 14px 0; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--ink-3); letter-spacing: 0.03em; text-transform: uppercase; }
.tile .v { font-family: var(--font-head); font-size: 22px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12.5px; color: var(--ink-2); }
.scroll { overflow-x: auto; }
.split { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; align-items: start; }

/* chips and bars */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px 2px 7px; border-radius: 999px; white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.c-done { color: var(--s-done); background: var(--s-done-bg); }
.c-ahead { color: var(--s-ahead); background: var(--s-ahead-bg); }
.c-on { color: var(--s-on); background: var(--s-on-bg); }
.c-slip { color: var(--s-slip); background: var(--s-slip-bg); }
.c-behind { color: var(--s-behind); background: var(--s-behind-bg); }
.c-crit { color: var(--s-crit); background: var(--s-crit-bg); }
.kind { font-size: 11.5px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }

.stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line-2); gap: 2px; }
.stack i { display: block; height: 100%; }
.f-done { background: var(--s-done); } .f-ahead { background: var(--s-ahead); } .f-on { background: var(--s-on); }
.f-slip { background: var(--s-slip); } .f-behind { background: var(--s-behind); } .f-crit { background: var(--s-crit); }

.dist { display: inline-grid; grid-template-columns: 1fr 1fr; width: 84px; height: 8px; background: var(--line-2); border-radius: 4px; overflow: hidden; vertical-align: middle; }
.dist .neg { justify-self: end; height: 100%; }
.dist .pos { height: 100%; }
.dist .neg.s-slip { background: var(--s-slip); } .dist .neg.s-behind { background: var(--s-behind); } .dist .neg.s-crit { background: var(--s-crit); } .dist .neg.s-on { background: var(--s-on); }
.dist .pos { background: var(--s-ahead); }
.dist-wrap { display: inline-flex; align-items: center; gap: 8px; }

.prog { position: relative; height: 12px; background: var(--line-2); border-radius: 6px; margin: 22px 0 8px; }
.prog .fill { height: 100%; border-radius: 6px; }
.prog .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 1px; }
.prog .tick::after { content: "pace"; position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 10.5px; letter-spacing: 0.04em; color: var(--ink-3); text-transform: uppercase; }
.fill.f-done { background: var(--s-done); }

/* tables */
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-weight: 500; font-size: 12px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
th.r, td.r { text-align: right; }
td.n { font-variant-numeric: tabular-nums; }
tr.lv-reg td { font-weight: 600; background: var(--surface-2); }
tr.lv-area td { font-weight: 600; }
tr.lv-ta td { color: var(--ink-2); }
tr.lv-ta td:first-child { color: var(--ink); }
.tog { border: 0; background: transparent; cursor: pointer; padding: 0 4px 0 0; width: 22px; color: var(--ink-3); }
.ind1 { padding-left: 20px !important; } .ind2 { padding-left: 40px !important; } .ind3 { padding-left: 62px !important; }
.lbl { display: inline-flex; align-items: center; gap: 4px; }
.twolines small { display: block; color: var(--ink-3); font-size: 12px; }

/* region cards */
.rcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
.rcard { display: flex; flex-direction: column; gap: 12px; }
.rcard header { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.score { font-family: var(--font-head); font-size: 34px; font-weight: 600; line-height: 1; text-align: right; font-variant-numeric: tabular-nums; }
.score small { display: block; font-family: var(--font-body); font-size: 11.5px; font-weight: 400; color: var(--ink-3); letter-spacing: 0.03em; text-transform: uppercase; margin-top: 4px; }
.plist { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.plist li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.plist .t { font-weight: 600; }
.plist .w { font-variant-numeric: tabular-nums; font-weight: 600; }
.plist .q { grid-column: 1 / -1; color: var(--ink-2); font-size: 13px; }
.wbar { grid-column: 1 / -1; height: 4px; background: var(--line-2); border-radius: 2px; }
.wbar i { display: block; height: 100%; background: var(--ink); border-radius: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); }

/* editor */
.edit { display: flex; flex-direction: column; gap: 12px; }
.edit .row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > span { font-size: 12px; color: var(--ink-3); letter-spacing: 0.03em; text-transform: uppercase; }
.field input[type=number] { width: 84px; }
.field input[type=text] { width: 100%; min-width: 160px; }
.field.grow { flex: 1 1 200px; }
.wt { display: flex; align-items: center; gap: 8px; }
.wt input[type=range] { width: 160px; accent-color: var(--ink); }
.readas { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: 6px; padding: 6px 10px; }
.total { font-weight: 600; }
.total.bad { color: var(--s-behind); }
.total.good { color: var(--s-ahead); }
.note { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; color: var(--ink-2); }
.note.warn { border-left-color: var(--s-slip); }
.quote { border-left: 3px solid var(--ink); padding: 2px 0 2px 12px; margin: 8px 0; font-size: 15px; }
.brief { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.brief li { display: grid; grid-template-columns: 72px 1fr; gap: 10px; }
.brief b { font-family: var(--font-head); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.pill small { opacity: 0.7; margin-left: 6px; }

/* TA week */
.pcard { display: flex; flex-direction: column; gap: 2px; }
.pcard .head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.pcard .big { font-family: var(--font-head); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pcard .lines { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.pcard .lines div { font-size: 12.5px; color: var(--ink-2); }
.pcard .lines b { display: block; color: var(--ink); font-size: 15px; font-variant-numeric: tabular-nums; }
details > summary { cursor: pointer; color: var(--ink-2); font-size: 13px; margin-top: 6px; }
details p { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
.days { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.day h4 { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 8px; }
.block { padding: 10px 0; border-top: 1px solid var(--line-2); }
.block .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.block .meta b { color: var(--ink); }
.block .act { margin-top: 2px; }
.block .why { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.todo { color: var(--s-behind); font-weight: 600; }
.mini { display: grid; grid-template-columns: 1fr repeat(6, 46px); gap: 4px; align-items: center; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.mini .h { color: var(--ink-3); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; text-align: center; }
.mini span.c { text-align: center; padding: 2px 0; border-radius: 4px; background: var(--surface-2); }
.mini span.c.fut { background: transparent; color: var(--ink-3); }

.empty { color: var(--ink-3); padding: 12px 0; }
pre { background: var(--surface-2); border-radius: 8px; padding: 12px; overflow-x: auto; font-size: 12px; line-height: 1.5; margin: 8px 0 0; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
.footer { margin-top: 32px; color: var(--ink-3); font-size: 12.5px; }

@media (max-width: 860px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2, .grid3, .split { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .top h1 { font-size: 22px; }
  .pcard .lines { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rcards { grid-template-columns: minmax(0, 1fr); }
  .brief li { grid-template-columns: 1fr; gap: 0; }
  .wt input[type=range] { width: 120px; }
  .score { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }

.wc { display: flex; flex-direction: column; }
.wcrow { display: flex; flex-direction: column; gap: 4px; padding: 10px 0; border-top: 1px solid var(--line-2); }
.wcrow:first-child { border-top: 0; padding-top: 0; }
.wchead { display: flex; justify-content: space-between; gap: 8px; }
.wcnums { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--ink-2); font-size: 13px; }
.wcnums b { color: var(--ink); }
.prog .tick.end::after { left: auto; right: -2px; transform: none; }
@media (max-width: 520px) {
  .ctl { flex-wrap: wrap; }
  .seg button { padding: 6px 9px; min-width: 38px; }
}

/* focus bars, plan approval */
:root { --pc0: 1; }
.tbar { display: flex; height: 14px; border-radius: 5px; overflow: hidden; gap: 2px; background: var(--line-2); min-width: 120px; }
.tbar i { display: block; height: 100%; min-width: 2px; }
.pc0 { background: var(--ink); } .pc1 { background: var(--ink); opacity: 0.68; } .pc2 { background: var(--ink); opacity: 0.45; } .pc3 { background: var(--ink); opacity: 0.28; } .pc4 { background: var(--ink); opacity: 0.16; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
ol.rank { margin: 0; padding: 0; list-style: none; font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; }
.whatif-days { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.wd { border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; }
.wd ul { margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--s-slip); color: #fff; font-size: 11px; font-weight: 700; text-align: center; margin-left: 4px; }
.banner { border: 1px solid var(--line); border-left: 4px solid var(--s-on); border-radius: 8px; background: var(--surface); padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.banner.pending { border-left-color: var(--s-slip); } .banner.active { border-left-color: var(--s-done); } .banner.returned { border-left-color: var(--s-behind); }
.bhead { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; flex: 1 1 320px; min-width: 0; }
.bact { display: flex; flex-wrap: wrap; gap: 8px; }
.block.edited { border-left: 3px solid var(--s-slip); padding-left: 9px; }
.bctl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.bctl select { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 3px 6px; font-size: 12.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
ul.flags { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
ul.flags li { border-left: 3px solid var(--s-slip); padding: 2px 0 2px 10px; color: var(--ink-2); }
ul.flags li.info { border-left-color: var(--line); }
.appr { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.appr .ahead { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.appr .arow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; }
.appr .arow input[type=text] { flex: 1 1 200px; min-width: 0; padding: 4px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
textarea { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
ol.rank { min-width: 230px; } ol.rank li { white-space: nowrap; }

/* scorecards */
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--ink-3); }
.crumbs [aria-current="true"] { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.ublock { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.ublock > header { display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.ublock h4 { font-size: 16px; }
.ulv { font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; }
.ovr { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ovr small { color: var(--ink-3); }
.ublocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sc { display: flex; flex-direction: column; gap: 6px; text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; min-width: 0; }
.sc:hover { border-color: var(--ink-3); }
.sc[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.sct { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.scl { font-size: 13px; }
.scr { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.scn { font-family: var(--font-head); font-weight: 600; font-size: 22px; }
.spark { display: flex; align-items: flex-end; gap: 3px; height: 24px; }
.spark i { flex: 1; border-radius: 2px 2px 0 0; min-height: 2px; }

/* history, acceptance */
.spark i.fut { background: var(--line); }
.spark.wk { height: 28px; min-width: 120px; }
.wchip { display: inline-block; font-size: 11.5px; padding: 1px 7px; border: 1px solid var(--line); border-radius: 999px; margin: 1px 2px 1px 0; white-space: nowrap; background: var(--surface-2); }
.awin { width: 72px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); text-align: right; }
.bad { color: var(--s-crit); }


/* ---------- role views, unit header, grouped tabs, pillars, polish ---------- */
.bar { background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); }
.bar .wrap { gap: 10px 18px; }
.bsp { flex: 1 1 0; min-width: 0; }
.roleseg { border-color: var(--ink-3); }
.roleseg button { padding: 7px 14px; font-weight: 500; white-space: nowrap; }
.roleseg button[aria-pressed="true"] { background: var(--focus); color: #fff; }
#unitCtl select { max-width: 260px; }

.ou { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px; margin: 4px 0 18px; display: flex; flex-direction: column; gap: 14px; }
.ou-main { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; align-items: center; }
.ou-id { min-width: 0; flex: 1 1 320px; }
.ou-lv { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--focus); font-weight: 600; }
.ou h2 { font-size: 24px; margin-top: 2px; }
.ou-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; color: var(--ink-2); font-size: 13px; }
.ou-meta span + span::before { content: "·"; margin-right: 16px; color: var(--ink-3); }
.ou-score { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ou-score .scn { font-family: var(--font-head); font-size: 40px; font-weight: 600; line-height: 1; }
.ou-score small { color: var(--ink-3); font-size: 12px; }
.ou-prios { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; border-top: 1px solid var(--line-2); padding-top: 14px; }
.oup { background: var(--surface-2); border-radius: 10px; padding: 9px 12px; min-width: 0; }
.oup-t { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; }
.oup-t .muted { margin-left: auto; font-size: 12px; }
.oup-s { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.oup-s .num { font-family: var(--font-head); font-size: 20px; font-weight: 600; min-width: 32px; }
.oup-bar { flex: 1; height: 7px; background: var(--line); border-radius: 4px; overflow: hidden; }
.oup-bar i { display: block; height: 100%; border-radius: 4px; }

.tabs { display: flex; gap: 6px 22px; flex-wrap: nowrap; overflow-x: auto; align-items: flex-end; border-bottom: 1px solid var(--line); margin-bottom: 22px; padding-bottom: 0; }
.tg { display: flex; flex-direction: column; gap: 0; flex: 0 0 auto; }
.tgl { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 2px 4px 0; }
.tgb { display: flex; gap: 0; }
.tabs button { padding: 8px 12px 10px; }
.tabs button[aria-selected="true"] { border-bottom-color: var(--focus); color: var(--ink); }

.ptag { display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 1px 7px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; white-space: nowrap; }
.pt-enrolment { color: var(--pt-enrolment); background: var(--pt-enrolment-bg); }
.pt-repayment { color: var(--pt-repayment); background: var(--pt-repayment-bg); }
.pt-hvc { color: var(--pt-hvc); background: var(--pt-hvc-bg); }
.pt-extension { color: var(--pt-extension); background: var(--pt-extension-bg); }
.pt-duka { color: var(--pt-duka); background: var(--pt-duka-bg); }
.wchip .ptag { margin-right: 4px; }

.pgrid th.c, .pgrid td.c { text-align: center; padding-inline: 4px; }
.pgrid th .live { display: block; font-size: 10px; color: var(--focus); letter-spacing: .05em; text-transform: uppercase; }
.pcell { display: inline-block; min-width: 36px; padding: 3px 0; border-radius: 6px; color: var(--surface); font-weight: 600; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.pnone { color: var(--ink-3); }

/* polish */
.panel, .tile { box-shadow: var(--shadow); border-radius: 12px; }
.panel { padding: 18px; }
table { border-collapse: collapse; }
tbody tr { transition: background .12s; }
tbody tr:hover { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
th { font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.btn { transition: border-color .12s, background .12s; }
.btn.solid:hover { opacity: .9; }
.top h1 { font-size: 28px; letter-spacing: -0.02em; }
.sec > h2, h2 { letter-spacing: -0.015em; }
@media (max-width: 720px) {
  .bsp { display: none; }
  .bar .wrap { gap: 8px 12px; }
  .roleseg { width: 100%; } .roleseg button { flex: 1; padding-inline: 6px; font-size: 12.5px; }
  .ou h2 { font-size: 20px; } .ou-score .scn { font-size: 32px; }
  .ou-meta span + span::before { display: none; } .ou-meta { gap: 2px 14px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.ctl[hidden] { display: none; }
@media (max-width: 720px) { .bar { position: static; } }
.tsn { font-size: 11.5px; margin-top: 3px; max-width: 220px; white-space: normal; }


/* ---------- v10 look: one dark header, calmer cards, pill tabs ---------- */
:root { --hd: #0F2E2A; --hd-2: #16403A; --hd-ink: #EAF3F1; --hd-mute: rgba(234,243,241,.62); --hd-line: rgba(234,243,241,.2); --brand: #2E9E7E; --focus: #2F6EA8; }
body { padding-block: 12px 56px; }
.hd { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 25; max-width: 1180px; margin: 0 auto 18px; background: var(--hd); color: var(--hd-ink); border-radius: 16px; box-shadow: 0 8px 28px rgba(8,28,25,.22); padding: 12px 18px; display: flex; flex-direction: column; gap: 10px; }
.hd-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.hd-row.hd-sub { border-top: 1px solid var(--hd-line); padding-top: 10px; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.brand b { font-family: var(--font-head); font-size: 19px; letter-spacing: -0.01em; display: block; line-height: 1.15; }
.brand small { color: var(--hd-mute); font-size: 12px; }
.mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #53C9A5, #1E7A62); position: relative; flex: none; }
.mark::after { content: ""; position: absolute; inset: 7px; border: 2px solid #fff; border-radius: 50%; border-right-color: transparent; transform: rotate(35deg); }
.hd .lab { color: var(--hd-mute); }
.hd select { background: rgba(255,255,255,.08); border-color: var(--hd-line); color: var(--hd-ink); }
.hd select option, .hd select optgroup { background: var(--surface); color: var(--ink); }
.hd .seg { background: transparent; border-color: var(--hd-line); }
.hd .seg button { color: var(--hd-ink); border-right-color: var(--hd-line); }
.hd .seg button:hover { background: rgba(255,255,255,.08); }
.hd .seg button[aria-pressed="true"] { background: #fff; color: var(--hd); }
.hd .roleseg { border-color: rgba(255,255,255,.4); }
.hd .roleseg button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.hd .bsp { flex: 1 1 0; }
.hd :focus-visible { outline-color: #8fd3bd; }

.ou { border-radius: 16px; padding: 18px 20px; position: relative; overflow: hidden; }
.ou::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--brand); }
.ou h2 { font-size: 26px; }
.ou-lv { color: var(--brand); }
.ou-prios { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.oup { background: var(--surface-2); border: 1px solid var(--line-2); }

.tabs { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px 6px; gap: 6px 26px; box-shadow: var(--shadow); margin-bottom: 24px; }
.tgl { padding-left: 10px; }
.tabs button { border: 0; border-radius: 9px; padding: 7px 12px; margin: 2px 0 4px; color: var(--ink-2); font-weight: 500; }
.tabs button:hover { background: var(--surface-2); color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--hd); color: #fff; font-weight: 600; border: 0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tabs button[aria-selected="true"] { background: var(--brand); } }
:root[data-theme="dark"] .tabs button[aria-selected="true"] { background: var(--brand); }

.panel, .tile, .rcard, .ublock { border-radius: 14px; }
.panel h3, .sec > h2 { letter-spacing: -0.015em; }
h2 { font-size: 21px; }
.sub { line-height: 1.5; }
.btn { border-radius: 9px; }
.btn.solid { background: var(--hd); border-color: var(--hd); color: #fff; }
.tile .v { font-size: 26px; }
.chip { padding: 3px 10px 3px 8px; }
td, th { padding-block: 9px; }
thead th { border-bottom: 1px solid var(--line); }
tbody tr + tr td { border-top: 1px solid var(--line-2); }
.pill { border-radius: 999px; }
@media (max-width: 720px) {
  .hd { position: static; padding: 12px 14px; border-radius: 14px; }
  .hd .roleseg { width: 100%; } .hd .roleseg button { flex: 1; padding-inline: 4px; font-size: 12px; }
  .brand small { display: none; }
  .tabs { padding: 6px 8px; }
}
@media (max-width: 720px) {
  .hd .roleseg { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
  .hd .roleseg button { padding: 8px 6px; font-size: 12.5px; border-bottom: 1px solid var(--hd-line); }
  .hd .roleseg button:nth-child(2n) { border-right: 0; }
  .hd .roleseg button:nth-child(n+3) { border-bottom: 0; }
  .hd .ctl { flex-wrap: wrap; }
}


/* ---------- Tupande look (brandbook): "market poster × agent's notebook" ----------
   Light only, like the Farm Planner. Status colours are derived from brand colours;
   Red Ochre is kept to small marks (critical, margin rule), never a solid background. */
:root, :root[data-theme="light"] {
  color-scheme: light;
  --t-green: #2B7F68; --t-green-dark: #1F5E4D; --t-green-20: #D5E5E1;
  --t-yellow: #E8B757; --t-yellow-20: #FAF1DD;
  --t-teal: #2F6067; --t-teal-20: #D9E4E5;
  --t-brown: #754C3D; --t-olive: #67724D; --t-leaf: #8F9A36;
  --t-sand: #DED6C0; --t-sand-20: #F5F2EA; --t-clay: #D8B39D;
  --t-ochre: #CF482B; --t-plum: #6F285B; --t-blue: #00B3B6;

  --bg: var(--t-sand-20); --surface: #FFFDF8; --surface-2: #F3EFE4;
  --ink: #22302D; --ink-2: #4A5552; --ink-3: #6B736F;
  --line: #D9D2BF; --line-2: #E8E2D2;
  --focus: var(--t-yellow); --btn: var(--t-green); --btn-ink: #fff;
  --brand: var(--t-green); --hd: var(--t-green); --hd-ink: var(--ink); --hd-mute: var(--ink-3); --hd-line: var(--line);

  --s-done: #1F5E4D;  --s-done-bg: #D5E5E1;
  --s-ahead: #2B7F68; --s-ahead-bg: #E2EEEA;
  --s-on: #2F6067;    --s-on-bg: #D9E4E5;
  --s-slip: #8A6414;  --s-slip-bg: #FAF1DD;
  --s-behind: #9A5530; --s-behind-bg: #F2E3D9;
  --s-crit: #B23C22;  --s-crit-bg: #F6DDD6;
  --pt-enrolment: #2F6067; --pt-enrolment-bg: #D9E4E5;
  --pt-repayment: #1F5E4D; --pt-repayment-bg: #D5E5E1;
  --pt-hvc: #6F285B; --pt-hvc-bg: #EEDDE8;
  --pt-extension: #5C6A1E; --pt-extension-bg: #ECEED6;
  --pt-duka: #754C3D; --pt-duka-bg: #EEE2DA;
  --shadow: 0 1px 2px rgba(34,48,45,.05);
  --font-body: "Source Sans 3", "Source Sans Pro", system-ui, sans-serif;
  --font-head: "Georama", "Arial Narrow", system-ui, sans-serif;
}
body { font-size: 15.5px; line-height: 1.5; background: var(--bg); color: var(--ink); }
h1, h2, h3, h4 { font-family: var(--font-head); font-weight: 700; letter-spacing: -0.01em; }
:focus-visible, .hd :focus-visible { outline: 3px solid var(--t-yellow); outline-offset: 2px; }

/* header: light paper bar with the co-branded logo (no inverted logo exists yet) */
.hd { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-top: 6px solid var(--t-green); border-radius: 14px; box-shadow: 0 6px 20px rgba(34,48,45,.08); }
.brand { gap: 12px; }
.brand .logo { height: 34px; width: auto; display: block; }
.brand .prod { border-left: 1px solid var(--line); padding-left: 12px; min-width: 0; }
.brand b { font-family: var(--font-head); font-weight: 800; font-size: 19px; color: var(--t-green-dark); }
.brand small { color: var(--ink-3); font-size: 12.5px; }
.hd .lab, .lab, .ctl label { color: var(--ink-3); font-weight: 600; }
.hd select { background: var(--surface); border-color: var(--line); color: var(--ink); }
.hd .seg { background: var(--surface); border-color: var(--line); }
.hd .seg button { color: var(--ink); border-right-color: var(--line-2); min-height: 40px; }
.hd .seg button:hover { background: var(--surface-2); }
.hd .seg button[aria-pressed="true"] { background: var(--t-teal); color: #fff; }
.hd .roleseg { border-color: var(--t-green); }
.hd .roleseg button[aria-pressed="true"] { background: var(--t-green); color: #fff; font-weight: 700; }
select { min-height: 40px; border-radius: 8px; }

/* unit header: the notebook page — faint ruled lines and a thin Red Ochre margin rule */
.ou { background-color: var(--surface);
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, rgba(217,210,191,.45) 31px 32px);
  border-color: var(--line); box-shadow: var(--shadow); padding-left: 28px; }
.ou::before { width: 2px; left: 16px; background: var(--t-ochre); opacity: .7; }
.ou-lv { color: var(--t-green); font-weight: 700; }
.ou h2 { font-weight: 800; font-size: 28px; }
.ou-score .scn, .scn, .score, .tile .v, .pcard .big, .oup-s .num { font-family: var(--font-head); font-weight: 800; font-variant-numeric: tabular-nums; }
.oup { background: var(--surface); border-color: var(--line); }

/* tabs: quiet notebook tabs, the selected one in Kakamega Green */
.tabs { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow); }
.tgl { color: var(--ink-3); font-weight: 700; }
.tabs button { min-height: 40px; color: var(--ink-2); font-weight: 600; }
.tabs button:hover { background: var(--t-green-20); color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--t-green); color: #fff; }

/* cards and pieces */
.panel, .tile, .rcard, .ublock { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow); }
.rcard { border-top: 4px solid var(--t-green); }
.wbar i { background: var(--t-teal); }
.btn { border-color: var(--line); background: var(--surface); min-height: 40px; font-weight: 600; }
.btn.small { min-height: 32px; }
.btn.solid { background: var(--t-green); border-color: var(--t-green); color: #fff; }
.btn.solid:hover { background: var(--t-green-dark); opacity: 1; }
.pill[aria-pressed="true"], .crumbs [aria-current="true"] { background: var(--t-green); border-color: var(--t-green); color: #fff; }
.wt input[type=range] { accent-color: var(--t-green); }
.quote { border-left-color: var(--t-yellow); }
.note.warn, ul.flags li { border-left-color: var(--t-yellow); }
.badge { background: var(--t-yellow); color: var(--ink); }
.banner { background: var(--surface); }
.pc0, .pc1, .pc2, .pc3, .pc4 { background: var(--t-teal); }
.prog .tick { background: var(--ink); }
.pgrid th .live { color: var(--t-green); }
th { color: var(--ink-3); }
tr.lv-reg td { background: var(--t-green-20); }
pre { background: var(--surface-2); }
@media (max-width: 720px) {
  .brand .logo { height: 28px; }
  .brand .prod { padding-left: 10px; }
  .hd .roleseg button { min-height: 44px; }
}
@media (max-width: 720px) { .brand small { display: block; font-size: 12px; } }

/* ---------- simple views: path, home, lists ---------- */
.linkbtn { border: 0; background: none; padding: 0; color: var(--t-green-dark); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: 32px; }
.who { gap: 8px; }
.who select { max-width: 240px; }
.path { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 10px; min-width: 0; }
.crumb { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.crumb small { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
.crumb span { color: var(--ink-2); }
.crumb b { font-family: var(--font-head); font-weight: 800; color: var(--ink); }
.crumb .linkbtn { min-height: 0; text-align: left; }
.path .sep { color: var(--ink-3); font-size: 18px; padding-bottom: 1px; }
.wkline { color: var(--ink-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hd-row[hidden] { display: none; }

.tabs .tgb { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.tabs { padding: 6px 8px; overflow: visible; }
.more { position: relative; margin-left: auto; }
.more > summary { list-style: none; cursor: pointer; padding: 8px 14px; border-radius: 9px; color: var(--ink-2); font-weight: 600; min-height: 40px; display: flex; align-items: center; margin-top: 0; font-size: inherit; }
.more > summary::-webkit-details-marker { display: none; }
.more > summary::after { content: "▾"; margin-left: 6px; font-size: 12px; }
.more > summary:hover { background: var(--t-green-20); color: var(--ink); }
.more > summary.on { color: var(--t-green-dark); }
.more-m { position: absolute; right: 0; top: calc(100% + 6px); z-index: 15; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(34,48,45,.14); padding: 6px; display: flex; flex-direction: column; min-width: 230px; }
.tabs .more-m button { text-align: left; margin: 0; }

.ou { margin-top: 0; }
.answer { font-size: 17px; color: var(--ink); border-top: 1px solid var(--line-2); padding-top: 12px; }
.waiting { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--t-yellow-20); border: 1px solid #EBD9A8; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
.sec > h2 { font-size: 21px; margin-bottom: 8px; }
.sec2 { font-size: 17px; margin: 18px 0 8px; }
.plist2 { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 12px; }

  /* ---------- per-TA, per-priority calculation ---------- */
  function paceAt(d, dl) { return Math.min(1, (d + 1) / (dl + 1)); }

  function calcTA(ta, p, d) {
    var m = METRICS[p.metric], S = null, base;
    if (m.kind === 'season') { S = ta.season[p.metric]; base = p.target / 100 * S; }
    else if (m.kind === 'rate') { S = ta.due; base = p.target / 100 * S; }
    else { base = p.target; }
    var A0 = ta.A0[p.metric] || 0;
    var gain = 0;
    for (var i = 0; i <= d; i++) gain += ta.daily[p.metric][i];
    var raw = base - A0;
    var need = Math.max(0, raw);
    var pace = paceAt(d, p.deadline);
    var expected = need * pace;
    var distance = gain - expected;
    var remaining = Math.max(0, need - gain);
    var progress = need > 0 ? Math.min(1, gain / need) : 1;

  function impactOf(row, days) {
    var l = S.prios[row.ta.regionId], rows = [], flags = [], cov = 0, recCov = 0;

      if (x.id === home.id) below = true;
      var name = esc(unitName(x));
      var body = '<small>' + esc(lv) + '</small>' + (cur ? '<b aria-current="page">' + name + '</b>' : mineOrBelow ? '<button class="linkbtn" data-act="goto" data-id="' + x.id + '">' + name + '</button>' : '<span>' + name + '</span>');
      return (i ? '<span class="sep" aria-hidden="true">›</span>' : '') + '<span class="crumb">' + body + '</span>';
    }).join('');
  }

  function render() {
    ensure();
    $('roleSel').value = S.role;
    var ws = $('whoSel'); ws.innerHTML = whoOptions();
    ws.value = S.role === 'rm' ? S.region : S.role === 'ac' ? S.sArea : S.role === 'zs' ? S.sZone : S.role === 'ta' ? S.sTa : S.sDa;
    $('wkSel').value = String(S.wk); $('dayCtl').hidden = S.wk !== 1;
    $('wkRow').hidden = !S.showWk; $('wkBtn').setAttribute('aria-expanded', String(S.showWk)); $('wkBtn').textContent = S.showWk ? 'Done' : 'Change';
    $('wkTxt').innerHTML = 'Week of <b>' + WEEKS[S.wk][0] + '</b>' + (S.wk === 1 ? ', ' + upTo() : ' · ' + WEEKS[S.wk][1]);
    document.querySelectorAll('[data-day]').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.dataset.day === S.day)); });
    $('path').innerHTML = pathHTML();
    $('tabs').innerHTML = tabsHTML();
    $('view').innerHTML = (S.wk !== 1 && S.tab !== 'priorities' && S.tab !== 'data' && S.tab !== 'home') ? offWeek() : VIEWS[S.tab]();
    try { history.replaceState(null, '', '#' + S.tab); } catch (e) { /* hash is a convenience only */ }
  }

  function leaveEdit() {
    if (!S.edit) return;
    var pl = S.plans[S.editKey];
    if (pl && pl.snap && pl.status !== 'proposed') { pl.days = pl.snap.days; pl.reason = pl.snap.reason; }
    if (pl) pl.snap = null;
    S.edit = false;
  }
  function startEdit(taId) {
    var r = rowOf(taId), pl = getPlan(taId);
    if (!pl.days) pl.days = cloneDays(r.plan.days);
    pl.snap = { days: JSON.parse(JSON.stringify(pl.days)), reason: pl.reason };
    S.edit = true; S.editTa = taId; S.editKey = pl.key; S.err[taId] = '';
  }
  function offWeek() {
    return '<div class="panel"><h3>No performance data for the week of ' + WEEKS[S.wk][0] + '</h3><p class="sub" style="margin:6px 0 12px">' + (S.wk === 0 ? 'The prototype holds activity for the week of 9 November only. In the real tool, last week’s numbers and plans would be here, read only.' : 'No activity has been recorded yet this week, so there are no results or plans. Plans are generated from the priorities the RM publishes.') + '</p><button class="btn solid small" data-act="thisWeek">Go to this week</button> <button class="btn small" data-act="goPriosWk">See the priorities for this week</button></div>';
  }
  function setTab(t) { leaveEdit(); S.tab = t; render(); window.scrollTo(0, 0); }

  function defaultTarget(k) { return { clients: 8, groups: 8, scoped: 70, repaid: 66, hvc: 20, training: 3, glcalls: 10, duka: 25 }[k]; }

  function onClick(e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.tab) return setTab(b.dataset.tab);
    if (b.dataset.day !== undefined) { leaveEdit(); S.day = +b.dataset.day; return render(); }
    var act = b.dataset.act; if (!act) return;
    if (act === 'goto') { leaveEdit(); S.at = b.dataset.id; var gu = DATA.byId[S.at]; if (gu.zoneId) S.zone = gu.zoneId; if (gu.tas) S.zone = gu.id; S.tab = 'home'; render(); window.scrollTo(0, 0); return; }
    if (act === 'wkToggle') { S.showWk = !S.showWk; return render(); }
    if (act === 'goRegion') { S.region = b.dataset.id; S.zone = null; S.ta = null; S.prio = null; return setTab('cascade'); }
    if (act === 'goPrios') { S.region = b.dataset.id; S.zone = null; S.ta = null; S.prio = null; return setTab('priorities'); }
    if (act === 'goAccept') return setTab('accept');
    if (act === 'goWeek') return setTab('week');
    if (act === 'prio') { S.prio = b.dataset.id; return render(); }
    if (act === 'toggle') { var id = b.dataset.id, def = id === S.region || id.indexOf('-a') > -1 && id.indexOf('-z') < 0 || (S.role === 'zs' && id === sZone().id); S.open[id] = !isOpen(id, def); return render(); }
    if (act === 'expandAll') { allZones(region()).forEach(function (z) { S.open[z.id] = true; S.open[z.areaId] = true; }); S.open[S.region] = true; return render(); }
    if (act === 'collapseAll') { allZones(region()).forEach(function (z) { S.open[z.id] = false; S.open[z.areaId] = true; }); return render(); }
    if (act === 'plan') { leaveEdit(); var t = DATA.byId[b.dataset.id]; S.region = t.regionId; S.ta = t.id; S.zone = t.zoneId; S.prio = null; return setTab('week'); }
    if (act === 'thisWeek') { S.wk = 1; return render(); }
    if (act === 'goPriosWk') { S.tab = 'priorities'; return render(); }
    if (act === 'copyCur') { S.wkPrios[S.region + '|2'] = JSON.parse(JSON.stringify(S.prios[S.region])); S.wkPub[S.region + '|2'] = false; return render(); }
    if (act === 'copyTo') { S.wkPrios[S.region + '|2'] = JSON.parse(JSON.stringify(prios())); S.wkPub[S.region + '|2'] = false; S.wk = 2; return render(); }
    if (act === 'publish') { S.wkPub[wkKey()] = true; return render(); }
    if (act === 'tuset') { S.tu = b.dataset.id || null; if (S.tu && DATA.byId[S.tu] && !DATA.byId[S.tu].zones && !DATA.byId[S.tu].tas) S.zone = DATA.byId[S.tu].zoneId; return render(); }
    if (act === 'tlevel') { S.tlevel = b.dataset.id; return render(); }
    if (act === 'role') {
      leaveEdit(); var nr = b.dataset.id, zz = S.zone && DATA.byId[S.zone];
      if (nr === 'ac' && zz) S.sArea = zz.areaId;
      if (nr === 'zs' && zz) S.sZone = zz.id;
      if (nr === 'ta' && S.ta && DATA.byId[S.ta] && !DATA.byId[S.ta].role) S.sTa = S.ta;
      S.role = nr; S.accEdit = null; S.tu = null; S.rvArea = null; S.rvZone = null; S.level = 'region'; S.rlevel = null; S.tlevel = null; S.zone = null; S.ta = null; S.open = {};
      return render();
    }
    var au = S.accRole === 'ac' ? S.accArea : S.zone, ac0 = null;
    if (act === 'accAccept') { ac0 = getAcc(au); ac0.status = 'active'; ac0.weights = null; ac0.draft = null; ac0.proposed = null; ac0.reason = ''; ac0.comment = ''; ac0.log.push('Accepted as set'); S.accEdit = null; S.accErr[au] = ''; return render(); }
    if (act === 'accEdit' || act === 'accWithdraw') {
      ac0 = getAcc(au);
      if (act === 'accWithdraw') { ac0.status = 'proposed'; ac0.log.push('Withdrawn'); }
      ac0.draft = (ac0.proposed && (act === 'accWithdraw' || ac0.status === 'returned') ? ac0.proposed : ac0.weights || prios().map(function (p) { return p.weight; })).slice();
      S.accEdit = au; S.accErr[au] = ''; return render();
    }
    if (act === 'accCancel') { ac0 = getAcc(au); ac0.draft = null; S.accEdit = null; S.accErr[au] = ''; return render(); }
    if (act === 'accReset') { ac0 = getAcc(au); ac0.draft = prios().map(function (p) { return p.weight; }); return render(); }
    if (act === 'accSend') {
      ac0 = getAcc(au); var rmw = prios().map(function (p) { return p.weight; }), dr = ac0.draft || rmw, totw = sum(dr, function (x) { return x; });
      var tooFar = dr.some(function (x, i) { return Math.abs(x - rmw[i]) > 20; });
      var ap0 = approverOf(DATA.byId[au]);
      if (totw !== 100) S.accErr[au] = 'The weights total ' + totw + '%. They must total 100.';
      else if (tooFar) S.accErr[au] = 'A weight can move by at most 20 points from the RM’s.';
      else if (dr.join() === rmw.join()) S.accErr[au] = 'The weights are the same as the RM’s. Accept them as set instead.';
      else if (!(ac0.reason || '').trim()) S.accErr[au] = 'Say why you are changing the weights. ' + ap0.who + ' needs it to decide.';
      else { ac0.proposed = dr.slice(); ac0.status = 'pending'; ac0.comment = ''; ac0.draft = null; ac0.log.push('Sent to ' + ap0.who); S.accEdit = null; S.accErr[au] = ''; }
      return render();
    }
    if (act === 'accApprove' || act === 'accReturn') {
      var uid = b.dataset.id; ac0 = peekAcc(uid); if (!ac0) return;
      var ap1 = approverOf(DATA.byId[uid]);
      if (act === 'accApprove') { ac0.status = 'active'; ac0.weights = ac0.proposed.slice(); ac0.approvedBy = ap1.who; ac0.log.push(ap1.who + ' approved'); S.accErr[uid] = ''; }
      else {
        var cm2 = ($('acm' + uid).value || '').trim();
        if (!cm2) { S.accErr[uid] = 'Add a comment so they know what to change.'; return render(); }
        ac0.status = 'returned'; ac0.comment = cm2; ac0.draftComment = ''; ac0.log.push(ap1.who + ' returned it'); S.accErr[uid] = '';
      }
      return render();
    }
    if (act === 'rprio') { S.rprio = b.dataset.id; return render(); }
    if (act === 'rvopen') { if (b.dataset.lv === 'area') { S.rvArea = b.dataset.id; S.rvZone = null; } else { S.rvZone = b.dataset.id; S.zone = b.dataset.id; } return render(); }
    if (act === 'rvup') { if (b.dataset.to === 'region') { S.rvArea = null; S.rvZone = null; } else S.rvZone = null; return render(); }
    if (act === 'rlevel') { S.rlevel = b.dataset.id; return render(); }
    if (act === 'zone') { S.zone = b.dataset.id; return render(); }
    if (act === 'whatif') { S.whatif = b.dataset.id; return render(); }
    if (act === 'level') { S.level = b.dataset.id; return render(); }
    var ta0 = S.ta, pl = S.plans[planKey(ta0)] || null, r0 = null;
    if (act === 'accept' || act === 'useRecAccept') {
      pl = getPlan(ta0); pl.status = 'active'; pl.days = null; pl.approvedBy = null; pl.snap = null; pl.reason = ''; pl.comment = '';
      pl.log.push('You accepted the recommended plan'); S.err[ta0] = ''; S.edit = false; return render();
    }
    if (act === 'editStart') { startEdit(ta0); return render(); }
    if (act === 'editCancel') { leaveEdit(); S.err[ta0] = ''; return render(); }
    if (act === 'useRec') { pl = getPlan(ta0); pl.days = null; pl.reason = ''; pl.snap = null; if (pl.status !== 'proposed') { pl.status = 'proposed'; } pl.log.push('You went back to the recommended plan'); S.edit = false; S.err[ta0] = ''; return render(); }
    if (act === 'withdraw') { pl = getPlan(ta0); pl.status = 'proposed'; pl.log.push('You withdrew the plan'); startEdit(ta0); return render(); }
    if (act === 'send') {
      pl = getPlan(ta0); r0 = rowOf(ta0);
      if (!pl.days || daysSig(pl.days) === daysSig(r0.plan.days)) S.err[ta0] = 'Nothing has changed from the recommended plan. Change a block first, or accept the plan as it is.';
      else if (!(pl.reason || '').trim()) S.err[ta0] = 'Say why you are changing the plan. ' + r0.zone.zs + ' needs it to decide.';
      else { pl.status = 'pending'; pl.comment = ''; pl.snap = null; pl.log.push('You sent it to ' + r0.zone.zs); S.edit = false; S.err[ta0] = ''; }
      return render();
    }
    if (act === 'bminus' || act === 'bplus' || act === 'bremove') {
      pl = getPlan(ta0); if (!pl.days) return;
      var fb = findBlock(pl, b.dataset.b); if (!fb) return;
      if (act === 'bremove') fb.day.blocks.splice(fb.j, 1);
      else {
        var nh = fb.block.hours + (act === 'bplus' ? 0.25 : -0.25);
        if (nh < 0.25 || (act === 'bplus' && dayHours(fb.day) + 0.25 > fb.day.cap + 1e-9)) return;
        fb.block.hours = nh; fb.block.edited = true; if (fb.block.metric) fb.block.units = nh / M[fb.block.metric].hrs;
      }
      S.err[ta0] = ''; return render();
    }
    if (act === 'addBlock') {
      pl = getPlan(ta0); if (!pl.days) return;
      var apid = $('addPid').value, aday = +$('addDay').value, ap = pById(apid), dd = pl.days.filter(function (x) { return x.i === aday; })[0];
      if (!dd) return;
      if (dayHours(dd) + 0.5 > dd.cap + 1e-9) { S.err[ta0] = dd.label + ' is full. Remove or shorten something there first.'; return render(); }
      S.uid++;
      dd.blocks.push({ bid: 'b' + S.uid, pid: apid, title: ap.title, metric: ap.metric, hours: 0.5, units: 0.5 / M[ap.metric].hrs, text: 'Your own addition: time on ' + ap.title + '.', reasons: ['Added by the TA'], part: 'Added', overdue: false, added: true, edited: false, rec: 0 });
      S.err[ta0] = ''; return render();
    }
    if (act === 'approve' || act === 'return') {
      var tid = b.dataset.id; pl = peekPlan(tid); if (!pl) return;
      var zsn = DATA.byId[DATA.byId[tid].zoneId].zs;
      if (act === 'approve') { pl.status = 'active'; pl.approvedBy = zsn; pl.log.push(zsn + ' approved it'); S.err[tid] = ''; }
      else {
        var cm = ($('cm' + tid).value || '').trim();
        if (!cm) { S.err[tid] = 'Add a comment so the TA knows what to change.'; return render(); }
        pl.status = 'returned'; pl.comment = cm; pl.draftComment = ''; pl.log.push(zsn + ' returned it'); S.err[tid] = '';
      }
      return render();
    }
    var l = prios();
    if (act === 'remove') { l.splice(+b.dataset.i, 1); return render(); }
    if (act === 'balance') {
      var tot = sum(l, function (p) { return p.weight; });
      if (tot === 0) l.forEach(function (p) { p.weight = Math.round(100 / l.length); });
      else l.forEach(function (p) { p.weight = Math.round(p.weight / tot * 100); });
      var diff = 100 - sum(l, function (p) { return p.weight; }); l[0].weight += diff;
      return render();
    }
    if (act === 'add') {
      var k = $('addMetric').value; S.uid++;
      l.push({ id: 'n' + S.uid, metric: k, title: M[k].label, text: 'New priority for the week.', target: defaultTarget(k), deadline: 4, weight: 0, norm: 0, aud: {} });
      return render();
    }
    if (act === 'reset') { S.prios[S.region] = WP.defaultPriorities(S.region); S.prio = null; return render(); }
  }

  function onInput(e) {
    if (e.target.id === 'accReason') { var unitR = S.accRole === 'ac' ? S.accArea : S.zone; getAcc(unitR).reason = e.target.value; return; }
    if (e.target.dataset.acm) { var pa = peekAcc(e.target.dataset.acm); if (pa) pa.draftComment = e.target.value; return; }
    if (e.target.dataset.aw !== undefined) return;
    if (e.target.id === 'planReason') { getPlan(S.ta).reason = e.target.value; return; }
    if (e.target.dataset.cm) { var pc = peekPlan(e.target.dataset.cm); if (pc) pc.draftComment = e.target.value; return; }
    var f = e.target.dataset.f; if (!f) return;
    var i = +e.target.dataset.i, p = prios()[i], v = e.target.value;
    if (f === 'title' || f === 'text') p[f] = v;
    else if (f === 'metric') return; // handled on change
    else p[f] = Math.max(0, Number(v) || 0);
    if (f === 'deadline') return;
    refreshLive();
  }
  function onChange(e) {
    var t = e.target;
    if (t.dataset.move) {
      var pl2 = getPlan(S.ta), fb2 = pl2.days ? findBlock(pl2, t.dataset.move) : null, to = t.value === '' ? null : +t.value;
      if (!fb2 || to === null) return render();
      var td = pl2.days.filter(function (x) { return x.i === to; })[0];
      if (dayHours(td) + fb2.block.hours > td.cap + 1e-9) { S.err[S.ta] = td.label + ' does not have ' + fmtH(fb2.block.hours) + ' h free. Shorten something there first.'; return render(); }
      fb2.day.blocks.splice(fb2.j, 1); fb2.block.edited = true; td.blocks.push(fb2.block); S.err[S.ta] = ''; return render();
    }
    if (t.dataset.aw !== undefined) { var unitW = S.accRole === 'ac' ? S.accArea : S.zone, aw = getAcc(unitW); if (aw.draft) { aw.draft[+t.dataset.aw] = Math.max(0, Math.round(Number(t.value) || 0)); } return render(); }
    if (t.id === 'roleSel') {
      leaveEdit(); var cu = curUnit(); S.role = t.value; S.at = null; S.accEdit = null; S.tu = null; S.rvArea = null; S.rvZone = null; S.level = 'region'; S.rlevel = null; S.tlevel = null; S.open = {};
      if (cu.zoneId) { S.sZone = cu.zoneId; S.sArea = cu.areaId; if (cu.role === 'DA') S.sDa = cu.id; else S.sTa = cu.id; } else if (cu.tas) { S.sZone = cu.id; S.sArea = cu.areaId; } else if (cu.zones) S.sArea = cu.id;
      S.zone = null; S.ta = null; S.tab = 'home'; return render();
    }
    if (t.id === 'whoSel') {
      leaveEdit(); var wu = DATA.byId[t.value]; S.region = wu.areas ? wu.id : wu.regionId; S.at = null; S.zone = null; S.ta = null; S.prio = null; S.accEdit = null; S.tu = null; S.rvArea = null; S.rvZone = null;
      if (S.role === 'ac') S.sArea = wu.id; else if (S.role === 'zs') S.sZone = wu.id; else if (S.role === 'ta') S.sTa = wu.id; else if (S.role === 'da') S.sDa = wu.id;
      return render();
    }
    if (t.id === 'wkSel') { leaveEdit(); S.wk = +t.value; if (S.wk !== 1 && S.tab !== 'data' && S.tab !== 'home') S.tab = 'priorities'; return render(); }
    if (t.id === 'zoneSel') S.accEdit = null;
    if (t.id === 'regSel' || t.id === 'zoneSel' || t.id === 'taSel') leaveEdit();
    if (t.id === 'regSel') { S.rvArea = null; S.rvZone = null; S.tu = null; S.accArea = null; S.accEdit = null; S.sArea = null; S.sZone = null; S.sTa = null; }
    if (t.id === 'unitSel') { leaveEdit(); if (S.role === 'ac') S.sArea = t.value; else if (S.role === 'ta') S.sTa = t.value; else S.sZone = t.value; S.accEdit = null; S.tu = null; S.rvArea = null; S.rvZone = null; S.zone = null; S.ta = null; return render(); }
    if (t.id === 'regSel') { S.region = t.value; S.zone = null; S.ta = null; S.prio = null; return render(); }
    if (t.id === 'zoneSel') { S.zone = t.value; return render(); }
    if (t.id === 'taSel') { S.ta = t.value; S.zone = DATA.byId[t.value].zoneId; return render(); }
    var f = t.dataset.f; if (!f) return;
    var p = prios()[+t.dataset.i];
    if (f === 'metric') {
      p.metric = t.value; p.target = defaultTarget(t.value); if (M[t.value].kind !== 'season') p.norm = 0;
      if (p.title === 'New priority' || Object.keys(M).some(function (k) { return M[k].label === p.title; })) p.title = M[t.value].label;
      return render();
    }
    if (f === 'deadline') { p.deadline = +t.value; }
    refreshLive();
    // other tabs read the model fresh on the next render
  }

  function init() {
    shell();
    var h = (location.hash || '').replace('#', '');
    if (VIEWS[h]) S.tab = h;
    document.addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    document.addEventListener('change', onChange);
    window.addEventListener('hashchange', function () { var x = (location.hash || '').replace('#', ''); if (VIEWS[x] && x !== S.tab) { S.tab = x; render(); } });
    render();
  }
  window.__WP = { S: S, DATA: DATA, render: render, setTab: setTab };
  init();
})();

</script>
